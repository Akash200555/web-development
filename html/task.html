<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TABLE</title>

    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }

        td,
        th {
            border: 1px solid black;
            padding: 10px
        }

        tr:nth-child(even) {
            background-color: #b9b9b9;
        }
    </style>
</head>

<body>
    <table>
        <tr>
            <th>TITLE</th>
            <th>VIDEO LINK</th>
        </tr>
        <tr>
            <td>Video 1</td>
            <td>
                <iframe width="560" height="315" src="https://www.youtube.com/embed/N2_ejs2i9do?si=klFgQnD6T-1Sqz4E"
                    title="YouTube video player" frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            </td>

        </tr>
        <tr>

            <td>
               <iframe width="560" height="315" src="https://www.youtube.com/embed/kLYhPtQR8E4?si=vwVVCD9es2pyskpz" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

</html>
